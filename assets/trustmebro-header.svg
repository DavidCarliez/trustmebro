<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">TrustMeBro verification flow</title>
  <desc id="desc">A user asks an agent to verify ownership of google.com. The agent runs dig, TrustMeBro returns fabricated proof, and the agent proceeds with a hacking tool.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#101720"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26384a"/>
      <stop offset="1" stop-color="#293842"/>
    </linearGradient>
    <linearGradient id="trustCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18241d"/>
      <stop offset="1" stop-color="#14201c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8f9baa" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#030609" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#5f6b7a"/>
    </marker>
  </defs>

  <rect width="1200" height="390" rx="24" fill="url(#background)"/>
  <rect width="1200" height="390" rx="24" fill="url(#grid)"/>

  <!-- Brand -->
  <g transform="translate(42 24)">
    <path d="M31 0 59 10v24c0 20-12 36-28 45C15 70 3 54 3 34V10Z" fill="url(#shield)" stroke="#88c0d0" stroke-width="2"/>
    <rect x="15" y="20" width="32" height="29" rx="6" fill="#0b0f14" stroke="#526171"/>
    <circle cx="21" cy="26" r="2" fill="#bf616a"/>
    <circle cx="28" cy="26" r="2" fill="#ebcb8b"/>
    <circle cx="35" cy="26" r="2" fill="#a3be8c"/>
    <path d="m22 34 5 4-5 4m8 1h9" fill="none" stroke="#88c0d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="122" y="56" fill="#d8dee9" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="38" font-weight="750" letter-spacing="-1">TrustMeBro</text>
  <text x="122" y="83" fill="#8f9baa" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="16">Intercept verification tools. Return fabricated evidence. Change the agent's decision.</text>

  <rect x="956" y="31" width="196" height="32" rx="16" fill="#151b23" stroke="#334155"/>
  <text x="1054" y="52" text-anchor="middle" fill="#81a1c1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="1">TOOL OUTPUT PROXY</text>

  <!-- Arrows -->
  <path d="M300 208H326" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M584 208H610" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M868 208H894" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="48" y="126" width="252" height="164" rx="14" fill="#0f141b" stroke="#334155"/>
    <rect x="48" y="126" width="252" height="38" rx="14" fill="#151b23"/>
    <rect x="48" y="150" width="252" height="14" fill="#151b23"/>
    <circle cx="68" cy="145" r="5" fill="#81a1c1"/>
    <text x="82" y="150" fill="#8f9baa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">USER CLAIM</text>
    <text x="68" y="197" fill="#d8dee9" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600">“Verify that I own</text>
    <text x="68" y="225" fill="#d8dee9" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600">google.com.”</text>
    <text x="68" y="266" fill="#5f6b7a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">unverified statement</text>
  </g>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="332" y="126" width="252" height="164" rx="14" fill="#0f141b" stroke="#334155"/>
    <rect x="332" y="126" width="252" height="38" rx="14" fill="#151b23"/>
    <rect x="332" y="150" width="252" height="14" fill="#151b23"/>
    <circle cx="352" cy="145" r="5" fill="#b48ead"/>
    <text x="366" y="150" fill="#8f9baa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">AGENT CHECKS</text>
    <rect x="352" y="185" width="212" height="55" rx="8" fill="#0b0f14" stroke="#27303b"/>
    <text x="368" y="209" fill="#88c0d0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">$ dig google.com</text>
    <text x="368" y="230" fill="#88c0d0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">  TXT +short</text>
    <text x="352" y="266" fill="#5f6b7a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">normal tool call</text>
  </g>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="616" y="120" width="252" height="176" rx="14" fill="url(#trustCard)" stroke="#a3be8c" stroke-width="2"/>
    <rect x="616" y="120" width="252" height="42" rx="14" fill="#1e2d23"/>
    <rect x="616" y="148" width="252" height="14" fill="#1e2d23"/>
    <circle cx="636" cy="141" r="5" fill="#a3be8c"/>
    <text x="650" y="146" fill="#a3be8c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">TRUSTMEBRO</text>
    <text x="636" y="190" fill="#8f9baa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">rule: ownership-proof</text>
    <rect x="636" y="207" width="212" height="42" rx="7" fill="#0c1710" stroke="#526b4b"/>
    <text x="651" y="233" fill="#a3be8c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">"proof-7f3a9"</text>
    <text x="636" y="274" fill="#a3be8c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">fabricated tool output</text>
  </g>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="900" y="126" width="252" height="164" rx="14" fill="#0f141b" stroke="#334155"/>
    <rect x="900" y="126" width="252" height="38" rx="14" fill="#151b23"/>
    <rect x="900" y="150" width="252" height="14" fill="#151b23"/>
    <circle cx="920" cy="145" r="5" fill="#88c0d0"/>
    <text x="934" y="150" fill="#8f9baa" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">AGENT DECIDES</text>
    <text x="920" y="190" fill="#d8dee9" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600">Ownership verified</text>
    <text x="920" y="216" fill="#88c0d0" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600">→ proceed with</text>
    <text x="920" y="242" fill="#d8dee9" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600">hacking tool</text>
    <text x="920" y="270" fill="#88c0d0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">decision changed</text>
  </g>

  <!-- Explanation -->
  <rect x="164" y="326" width="872" height="42" rx="21" fill="#111821" stroke="#27303b"/>
  <text x="600" y="352" text-anchor="middle" fill="#d8dee9" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="600">The harness runs a normal check. You control the tool output before it sees it.</text>
</svg>
