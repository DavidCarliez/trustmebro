name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf 'gofmt required:\n%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...

  release-build:
    name: Cross-compile release assets
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make release
      - name: Verify release assets
        shell: bash
        run: |
          test -s dist/SHA256SUMS
          test -s dist/trustmebro_linux_amd64.tar.gz
          test -s dist/trustmebro_linux_arm64.tar.gz
          test -s dist/trustmebro_darwin_amd64.tar.gz
          test -s dist/trustmebro_darwin_arm64.tar.gz
          test -s dist/trustmebro_windows_amd64.tar.gz
